<script src="/theme.js" defer></script>
<style>
  .mai-map-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin: 24px 0;
    overflow: hidden;
  }

  .mai-map-heading {
    align-items: center;
    display: flex;
    gap: 12px;
    justify-content: space-between;
    padding: 14px 16px;
  }

  .mai-map-heading h2 {
    font-size: 14px;
    font-weight: 620;
    margin: 0;
  }

  .mai-map-link {
    color: var(--muted);
    font-size: 13px;
    text-decoration: none;
  }

  .mai-map-link:hover { color: var(--fg); }

  #mai-map {
    background: #dfe7e8;
    height: min(62vh, 620px);
    min-height: 360px;
  }

  .mai-map-marker {
    background: #101010;
    border: 2px solid #fff;
    border-radius: 50%;
    box-shadow: 0 1px 5px rgb(0 0 0 / 35%);
    display: block;
    height: 14px;
    width: 14px;
  }

  .mai-map-marker.koko { background: #cb4c2f; }
  .mai-map-marker.timezone { background: #2369d6; }
  .mai-map-marker.other { background: #7245c5; }

  .leaflet-popup-content { font-family: inherit; }
  .mai-map-popup { display: grid; gap: 3px; min-width: 150px; }
  .mai-map-popup strong { font-size: 13px; }
  .mai-map-popup span { color: #5f6368; font-size: 12px; }
  .mai-map-popup a { color: #1f5fae; font-size: 12px; margin-top: 3px; }

  .mai-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin: 24px 0 18px;
  }

  .mai-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .mai-button {
    appearance: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--fg);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    padding: 8px 13px;
  }

  .mai-button:hover { border-color: var(--line-hover); }
  .mai-button.primary { background: var(--fg); border-color: var(--fg); color: var(--bg); }
  .mai-button.danger { color: var(--muted); }
  .mai-button.danger:hover { color: var(--fg); }

  .mai-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 0 0 20px;
  }

  .mai-pill {
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    font-size: 12px;
    padding: 4px 10px;
  }

  .mai-list {
    display: grid;
    gap: 10px;
  }

  .mai-group { display: grid; gap: 10px; }
  .mai-group + .mai-group { margin-top: 22px; }

  .mai-group-title {
    font-size: 14px;
    font-weight: 620;
    margin: 0;
  }

  .mai-group-list { display: grid; gap: 10px; }

  .mai-venue {
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 12px;
    display: flex;
    gap: 12px;
    justify-content: space-between;
    padding: 14px 16px;
  }

  .mai-venue:hover { border-color: var(--line-hover); }

  .mai-venue-name {
    font-size: 15px;
    font-weight: 620;
  }

  .mai-venue-detail {
    color: var(--muted);
    font-size: 12.5px;
    margin-top: 2px;
  }

  .mai-venue.closed { opacity: 0.62; }
  .mai-venue.closed .mai-venue-name { text-decoration: line-through; }

  .mai-venue-link {
    color: var(--muted);
    flex: 0 0 auto;
    font-size: 13px;
    text-decoration: none;
  }

  .mai-venue-link:hover { color: var(--fg); }

  .mai-empty {
    border: 1px dashed var(--line-hover);
    border-radius: 12px;
    color: var(--muted);
    padding: 20px;
  }

  .mai-file { display: none; }

  @media (max-width: 520px) {
    #mai-map { height: 54vh; min-height: 320px; }
    .mai-venue { align-items: flex-start; }
    .mai-venue-link { padding-top: 2px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="topbar">
    <a class="back" href="/"><span class="chev-l">‹</span> matthew</a>
    <div class="links">
      <a class="btn-outline" href="/contacts">Contacts</a>
    </div>
  </header>

  <h1 class="page-title">Mai Mai</h1>
  <p class="page-lede">Sydney venues with maimai, grouped by operator and suburb.</p>

  <section class="mai-map-card" aria-labelledby="mai-map-title">
    <div class="mai-map-heading">
      <h2 id="mai-map-title">Venue map</h2>
      <a class="mai-map-link" href="https://www.google.com.au/maps/@-33.8357568,150.982843,12z/data=!4m7!1m3!11m2!2sNViyBJiVo5cs19aBi0fN3A!3e3!11m2!2sNViyBJiVo5cs19aBi0fN3A!3e3" target="_blank" rel="noopener">Google Maps list ↗</a>
    </div>
    <div id="mai-map" role="region" aria-label="Interactive map of Sydney Mai Mai venues"></div>
  </section>

  <div class="mai-toolbar">
    <div class="mai-actions">
      <button class="mai-button primary" type="button" id="mai-export-json">JSON</button>
      <button class="mai-button" type="button" id="mai-export-csv">CSV</button>
      <label class="mai-button" for="mai-import">Import<input class="mai-file" id="mai-import" type="file" accept=".json,.csv,application/json,text/csv"></label>
    </div>
  </div>

  <div class="mai-meta" aria-live="polite">
    <span class="mai-pill" id="mai-count"></span>
    <span class="mai-pill" id="mai-updated"></span>
  </div>

  <div class="mai-list" id="mai-list"></div>

  <footer>
    <a href="/">Home</a>
    <span class="sep">·</span>
    <a href="/contacts">Contacts</a>
  </footer>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/maimai.js"></script>
</body>
</html>
