<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper</title>
<meta name="description" content="Minesweeper. Three difficulties, first click always safe, flag with right-click or long-press.">
<meta property="og:title" content="Minesweeper">
<meta property="og:description" content="Minesweeper. Three difficulties, first click always safe, flag with right-click or long-press.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mtw4244.work/minesweeper">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23111%22/><text x=%2250%22 y=%2270%22 font-family=%22Arial, Helvetica, sans-serif%22 font-weight=%22700%22 font-size=%2262%22 fill=%22%23fff%22 text-anchor=%22middle%22>M</text></svg>">
<link rel="stylesheet" href="style.css">
<style>
  .ms-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }

  .ms-select {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
  }

  .ms-hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    padding: 14px 20px;
    margin-bottom: 16px;
  }

  .ms-stat { display: flex; flex-direction: column; align-items: center; min-width: 64px; }
  .ms-stat .ms-lbl { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 650; }
  .ms-stat .ms-val { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }

  .ms-face { font-size: 22px; background: none; border: 1px solid var(--line); border-radius: 999px; width: 42px; height: 42px; cursor: pointer; color: var(--fg); }
  .ms-face:hover { border-color: var(--line-hover); }

  #board {
    display: grid;
    gap: 2px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    user-select: none;
    touch-action: manipulation;
  }

  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--card);
    color: var(--fg);
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    aspect-ratio: 1;
  }

  .cell.revealed { background: var(--bg); cursor: default; }
  .cell.mine.exploded { background: var(--fg); color: #000; }
  .cell.flag { background: var(--card); color: var(--muted); }

  .ms-msg { text-align: center; margin-top: 16px; color: var(--muted); font-size: 14.5px; min-height: 1.4em; }
  .ms-msg.win { color: var(--fg); font-weight: 650; }
  .ms-msg.lose { color: var(--fg); font-weight: 650; }

  .ms-keybinds { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }

  .ms-kbtn {
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .ms-kbtn:hover { border-color: var(--line-hover); }
  .ms-kbtn.listening { border-color: var(--muted); color: var(--muted); }
  .ms-hint { font-size: 12px; color: var(--muted); }

  .ms-theme-wrap { position: relative; }

  .ms-theme-panel {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    z-index: 20;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 8px;
    width: min(380px, 82vw);
    padding: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
  }
  .ms-theme-panel.hidden { display: none; }

  .ms-swatch {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: none;
    cursor: pointer;
    font: inherit;
  }
  .ms-swatch:hover { border-color: var(--line-hover); }
  .ms-swatch.active { border-color: var(--muted); }
  .ms-swatch-preview {
    width: 100%;
    height: 26px;
    border-radius: 6px;
    display: flex;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .ms-swatch-preview span { flex: 1; }
  .ms-swatch-name { font-size: 10.5px; color: var(--muted); text-align: center; line-height: 1.2; }

  @media (max-width: 520px) {
    .ms-hud { padding: 12px 16px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="topbar">
    <a class="back" href="/"><span class="chev-l">‹</span> matthew</a>
    <span class="tag-muted">no build step</span>
  </header>

  <h1 class="page-title">Minesweeper</h1>
  <p class="page-lede">Three difficulties. First click is always safe. Flag with right-click, or long-press on mobile.</p>

  <div class="ms-controls">
    <select class="ms-select" id="difficulty">
      <option value="beginner">Beginner · 9×9 · 10 mines</option>
      <option value="intermediate" selected>Intermediate · 16×16 · 40 mines</option>
      <option value="expert">Expert · 30×16 · 99 mines</option>
    </select>
    <button class="btn" id="new-game" style="padding:8px 16px;">New game</button>
  </div>

  <div class="ms-keybinds">
    <button class="ms-kbtn" id="reveal-key-btn" type="button"></button>
    <button class="ms-kbtn" id="flag-key-btn" type="button"></button>
    <span class="ms-hint">Hover a cell, then press your key</span>
    <div class="ms-theme-wrap">
      <button class="ms-kbtn" id="theme-btn" type="button">🎨 Theme</button>
      <div class="ms-theme-panel hidden" id="theme-panel"></div>
    </div>
  </div>

  <div class="ms-hud">
    <div class="ms-stat"><span class="ms-lbl">Mines</span><span class="ms-val" id="mine-count">0</span></div>
    <button class="ms-face" id="face" aria-label="New game">﹀</button>
    <div class="ms-stat"><span class="ms-lbl">Time</span><span class="ms-val" id="timer">0</span></div>
  </div>

  <div id="board"></div>
  <div class="ms-msg" id="msg"></div>

  <footer>
    <span>Left click: reveal · Right click / long-press: flag · Hover + key: customizable</span>
    <span class="sep">·</span>
    <a href="/">Back</a>
  </footer>

</div>

<script>
const DIFFICULTIES = {
  beginner:     { rows: 9,  cols: 9,  mines: 10 },
  intermediate: { rows: 16, cols: 16, mines: 40 },
  expert:       { rows: 16, cols: 30, mines: 99 },
};

const THEMES = [
  { id: 'default',          name: 'Default',          bg: '#000000', card: '#0a0a0a', line: '#1e1e1e', lineHover: '#3a3a3a', fg: '#f2f2f2', muted: '#8b8b8b' },
  { id: 'dracula',          name: 'Dracula',           bg: '#282a36', card: '#21222c', line: '#44475a', lineHover: '#6272a4', fg: '#f8f8f2', muted: '#bd93f9' },
  { id: 'nord',             name: 'Nord',               bg: '#2e3440', card: '#3b4252', line: '#4c566a', lineHover: '#5e81ac', fg: '#eceff4', muted: '#88c0d0' },
  { id: 'gruvbox-dark',     name: 'Gruvbox Dark',      bg: '#282828', card: '#1d2021', line: '#3c3836', lineHover: '#504945', fg: '#ebdbb2', muted: '#fabd2f' },
  { id: 'gruvbox-light',    name: 'Gruvbox Light',     bg: '#fbf1c7', card: '#f2e5bc', line: '#d5c4a1', lineHover: '#bdae93', fg: '#3c3836', muted: '#af3a03' },
  { id: 'solarized-dark',   name: 'Solarized Dark',    bg: '#002b36', card: '#073642', line: '#586e75', lineHover: '#657b83', fg: '#eee8d5', muted: '#268bd2' },
  { id: 'solarized-light',  name: 'Solarized Light',   bg: '#fdf6e3', card: '#eee8d5', line: '#93a1a1', lineHover: '#839496', fg: '#073642', muted: '#268bd2' },
  { id: 'monokai',          name: 'Monokai',            bg: '#272822', card: '#1e1f1c', line: '#49483e', lineHover: '#75715e', fg: '#f8f8f2', muted: '#a6e22e' },
  { id: 'one-dark',         name: 'One Dark',           bg: '#282c34', card: '#21252b', line: '#3e4451', lineHover: '#528bff', fg: '#abb2bf', muted: '#61afef' },
  { id: 'tokyo-night',      name: 'Tokyo Night',       bg: '#1a1b26', card: '#16161e', line: '#2f3549', lineHover: '#414868', fg: '#c0caf5', muted: '#7aa2f7' },
  { id: 'catppuccin-mocha', name: 'Catppuccin Mocha',  bg: '#1e1e2e', card: '#181825', line: '#313244', lineHover: '#45475a', fg: '#cdd6f4', muted: '#f5c2e7' },
  { id: 'catppuccin-latte', name: 'Catppuccin Latte',  bg: '#eff1f5', card: '#e6e9ef', line: '#ccd0da', lineHover: '#bcc0cc', fg: '#4c4f69', muted: '#8839ef' },
  { id: 'rose-pine',        name: 'Rosé Pine',          bg: '#191724', card: '#1f1d2e', line: '#26233a', lineHover: '#403d52', fg: '#e0def4', muted: '#c4a7e7' },
  { id: 'ayu-dark',         name: 'Ayu Dark',           bg: '#0a0e14', card: '#0d1017', line: '#1c212b', lineHover: '#2d3640', fg: '#e6e1cf', muted: '#ffb454' },
  { id: 'night-owl',        name: 'Night Owl',          bg: '#011627', card: '#01111d', line: '#1d3b53', lineHover: '#2c5372', fg: '#d6deeb', muted: '#82aaff' },
  { id: 'synthwave-84',     name: 'Synthwave ’84', bg: '#241b2f', card: '#2a2139', line: '#495495', lineHover: '#ff7edb', fg: '#f4eee4', muted: '#ff7edb' },
  { id: 'material',         name: 'Material',           bg: '#263238', card: '#1e272c', line: '#37474f', lineHover: '#546e7a', fg: '#eeffff', muted: '#82aaff' },
  { id: 'everforest',       name: 'Everforest',         bg: '#2d353b', card: '#232a2e', line: '#475258', lineHover: '#5c6a72', fg: '#d3c6aa', muted: '#a7c080' },
  { id: 'kanagawa',         name: 'Kanagawa',           bg: '#1f1f28', card: '#16161d', line: '#2a2a37', lineHover: '#54546d', fg: '#dcd7ba', muted: '#7e9cd8' },
  { id: 'github-dark',      name: 'GitHub Dark',       bg: '#0d1117', card: '#161b22', line: '#30363d', lineHover: '#8b949e', fg: '#c9d1d9', muted: '#58a6ff' },
  { id: 'github-light',     name: 'GitHub Light',      bg: '#ffffff', card: '#f6f8fa', line: '#d0d7de', lineHover: '#8c959f', fg: '#1f2328', muted: '#0969da' },
];

const boardEl = document.getElementById('board');
const mineCountEl = document.getElementById('mine-count');
const timerEl = document.getElementById('timer');
const faceEl = document.getElementById('face');
const msgEl = document.getElementById('msg');
const difficultySel = document.getElementById('difficulty');
const newGameBtn = document.getElementById('new-game');
const revealKeyBtn = document.getElementById('reveal-key-btn');
const flagKeyBtn = document.getElementById('flag-key-btn');
const themeBtn = document.getElementById('theme-btn');
const themeWrap = document.querySelector('.ms-theme-wrap');
const themePanel = document.getElementById('theme-panel');

let rows, cols, mineCount;
let grid = [];
let revealedCount = 0;
let flagCount = 0;
let firstClick = true;
let gameOver = false;
let timerId = null;
let seconds = 0;

function inBounds(r, c) { return r >= 0 && r < rows && c >= 0 && c < cols; }

function neighbours(r, c) {
  const out = [];
  for (let dr = -1; dr <= 1; dr++)
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      if (inBounds(r + dr, c + dc)) out.push([r + dr, c + dc]);
    }
  return out;
}

function buildGrid() {
  grid = Array.from({ length: rows }, () =>
    Array.from({ length: cols }, () => ({
      mine: false, revealed: false, flagged: false, exploded: false, adj: 0,
    }))
  );
}

function placeMines(safeR, safeC) {
  const safeCells = new Set(neighbours(safeR, safeC).map(([r, c]) => `${r},${c}`));
  safeCells.add(`${safeR},${safeC}`);
  let placed = 0;
  while (placed < mineCount) {
    const r = Math.floor(Math.random() * rows);
    const c = Math.floor(Math.random() * cols);
    if (grid[r][c].mine || safeCells.has(`${r},${c}`)) continue;
    grid[r][c].mine = true;
    placed++;
  }
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      if (!grid[r][c].mine)
        grid[r][c].adj = neighbours(r, c).filter(([nr, nc]) => grid[nr][nc].mine).length;
}

function startTimer() {
  stopTimer();
  seconds = 0;
  timerEl.textContent = '0';
  timerId = setInterval(() => {
    seconds++;
    timerEl.textContent = seconds;
  }, 1000);
}
function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }

function render() {
  boardEl.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
  boardEl.style.maxWidth = `${cols * 34}px`;
  boardEl.innerHTML = '';
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = grid[r][c];
      const div = document.createElement('div');
      div.className = 'cell';
      div.dataset.r = r;
      div.dataset.c = c;
      if (cell.revealed) {
        div.classList.add('revealed');
        if (cell.mine) {
          div.classList.add('mine');
          if (cell.exploded) div.classList.add('exploded');
          div.textContent = '*';
        } else if (cell.adj > 0) {
          div.textContent = cell.adj;
        }
      } else if (cell.flagged) {
        div.classList.add('flag');
        div.textContent = '⚑';
      }
      boardEl.appendChild(div);
    }
  }
}

function revealCell(r, c) {
  const cell = grid[r][c];
  if (cell.revealed || cell.flagged) return;
  cell.revealed = true;
  revealedCount++;
  if (cell.adj === 0 && !cell.mine) {
    for (const [nr, nc] of neighbours(r, c)) revealCell(nr, nc);
  }
}

function revealAllMines() {
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      if (grid[r][c].mine) grid[r][c].revealed = true;
}

function checkWin() {
  return revealedCount === rows * cols - mineCount;
}

function endGame(won) {
  gameOver = true;
  stopTimer();
  faceEl.textContent = won ? '☺' : '×';
  msgEl.textContent = won ? `Cleared it in ${seconds}s.` : 'Hit a mine. Try again.';
  msgEl.className = 'ms-msg ' + (won ? 'win' : 'lose');
  if (!won) revealAllMines();
  render();
}

function handleReveal(r, c) {
  if (gameOver) return;
  const cell = grid[r][c];
  if (cell.flagged || cell.revealed) return;

  if (firstClick) {
    placeMines(r, c);
    firstClick = false;
    startTimer();
  }

  if (cell.mine) {
    cell.revealed = true;
    cell.exploded = true;
    endGame(false);
    return;
  }

  revealCell(r, c);
  render();
  if (checkWin()) endGame(true);
}

function handleFlag(r, c) {
  if (gameOver) return;
  const cell = grid[r][c];
  if (cell.revealed) return;
  if (!cell.flagged && flagCount >= mineCount) return;
  cell.flagged = !cell.flagged;
  flagCount += cell.flagged ? 1 : -1;
  mineCountEl.textContent = mineCount - flagCount;
  render();
}

boardEl.addEventListener('click', (e) => {
  const target = e.target.closest('.cell');
  if (!target) return;
  handleReveal(Number(target.dataset.r), Number(target.dataset.c));
});
boardEl.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const target = e.target.closest('.cell');
  if (!target) return;
  handleFlag(Number(target.dataset.r), Number(target.dataset.c));
});

let longPressTimer = null;
boardEl.addEventListener('touchstart', (e) => {
  const target = e.target.closest('.cell');
  if (!target) return;
  longPressTimer = setTimeout(() => {
    handleFlag(Number(target.dataset.r), Number(target.dataset.c));
    longPressTimer = null;
  }, 450);
});
boardEl.addEventListener('touchend', () => {
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
});

// --- Keybinds: hover a cell, press a key to reveal/flag it (in addition to click/right-click) ---
const keybinds = {
  reveal: localStorage.getItem('ms-key-reveal') || 'f',
  flag: localStorage.getItem('ms-key-flag') || 'd',
};
let hoverR = null, hoverC = null;
let listeningFor = null;

boardEl.addEventListener('mouseover', (e) => {
  const target = e.target.closest('.cell');
  if (!target) return;
  hoverR = Number(target.dataset.r);
  hoverC = Number(target.dataset.c);
});
boardEl.addEventListener('mouseleave', () => { hoverR = null; hoverC = null; });

function displayKey(key) {
  if (key === ' ') return 'Space';
  return key.length === 1 ? key.toUpperCase() : key;
}

function updateKeybindLabels() {
  if (listeningFor !== 'reveal') revealKeyBtn.textContent = `Reveal: ${displayKey(keybinds.reveal)}`;
  if (listeningFor !== 'flag') flagKeyBtn.textContent = `Flag: ${displayKey(keybinds.flag)}`;
}

function stopListening() {
  listeningFor = null;
  revealKeyBtn.classList.remove('listening');
  flagKeyBtn.classList.remove('listening');
  updateKeybindLabels();
}

function startListening(which) {
  listeningFor = which;
  revealKeyBtn.classList.toggle('listening', which === 'reveal');
  flagKeyBtn.classList.toggle('listening', which === 'flag');
  (which === 'reveal' ? revealKeyBtn : flagKeyBtn).textContent = 'Press a key…';
}

function setKeybind(which, rawKey) {
  const key = rawKey.length === 1 ? rawKey.toLowerCase() : rawKey;
  const other = which === 'reveal' ? 'flag' : 'reveal';
  if (keybinds[other] === key) keybinds[other] = keybinds[which]; // swap so both stay usable
  keybinds[which] = key;
  localStorage.setItem(`ms-key-${which}`, keybinds[which]);
  localStorage.setItem(`ms-key-${other}`, keybinds[other]);
}

revealKeyBtn.addEventListener('click', () => startListening('reveal'));
flagKeyBtn.addEventListener('click', () => startListening('flag'));

document.addEventListener('keydown', (e) => {
  if (listeningFor) {
    if (['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) return;
    e.preventDefault();
    if (e.key === 'Escape') { stopListening(); return; }
    setKeybind(listeningFor, e.key);
    stopListening();
    return;
  }
  if (hoverR === null || hoverC === null) return;
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (key === keybinds.reveal) { e.preventDefault(); handleReveal(hoverR, hoverC); }
  else if (key === keybinds.flag) { e.preventDefault(); handleFlag(hoverR, hoverC); }
});

// --- Theme picker ---
function applyTheme(theme) {
  const root = document.documentElement.style;
  root.setProperty('--bg', theme.bg);
  root.setProperty('--card', theme.card);
  root.setProperty('--line', theme.line);
  root.setProperty('--line-hover', theme.lineHover);
  root.setProperty('--fg', theme.fg);
  root.setProperty('--muted', theme.muted);
}

function selectTheme(id) {
  const theme = THEMES.find((t) => t.id === id) || THEMES[0];
  applyTheme(theme);
  localStorage.setItem('ms-theme', theme.id);
  themePanel.querySelectorAll('.ms-swatch').forEach((el) => {
    el.classList.toggle('active', el.dataset.id === theme.id);
  });
}

function buildThemePanel() {
  themePanel.innerHTML = '';
  for (const t of THEMES) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ms-swatch';
    btn.dataset.id = t.id;
    btn.title = t.name;
    btn.innerHTML =
      `<span class="ms-swatch-preview"><span style="background:${t.bg}"></span><span style="background:${t.card}"></span><span style="background:${t.muted}"></span></span>` +
      `<span class="ms-swatch-name">${t.name}</span>`;
    btn.addEventListener('click', () => selectTheme(t.id));
    themePanel.appendChild(btn);
  }
}

themeBtn.addEventListener('click', () => themePanel.classList.toggle('hidden'));
document.addEventListener('click', (e) => {
  if (!themeWrap.contains(e.target)) themePanel.classList.add('hidden');
});

function newGame() {
  const d = DIFFICULTIES[difficultySel.value];
  rows = d.rows; cols = d.cols; mineCount = d.mines;
  revealedCount = 0; flagCount = 0; firstClick = true; gameOver = false;
  stopTimer();
  seconds = 0;
  timerEl.textContent = '0';
  faceEl.textContent = '﹀';
  msgEl.textContent = '';
  msgEl.className = 'ms-msg';
  mineCountEl.textContent = mineCount;
  buildGrid();
  render();
}

newGameBtn.addEventListener('click', newGame);
faceEl.addEventListener('click', newGame);
difficultySel.addEventListener('change', newGame);

updateKeybindLabels();
buildThemePanel();
selectTheme(localStorage.getItem('ms-theme') || 'default');
newGame();
</script>
</body>
</html>
